name: Notebook Structure Checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-notebooks:
    name: Validate notebook files
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install notebook validator
        run: python -m pip install nbformat

      - name: Validate notebook JSON and structure
        run: |
          python - <<'PY'
          from pathlib import Path
          import nbformat

          notebooks = sorted(Path(".").glob("*.ipynb"))
          if not notebooks:
              raise SystemExit("No notebooks found at repository root.")

          failures = []
          for path in notebooks:
              try:
                  notebook = nbformat.read(path, as_version=4)
                  nbformat.validate(notebook)
                  print(f"VALID: {path}")
              except Exception as exc:
                  failures.append((path, exc))

          if failures:
              for path, exc in failures:
                  print(f"INVALID: {path}: {exc}")
              raise SystemExit(1)
          PY
