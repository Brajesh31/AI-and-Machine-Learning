name: Notebook Quality Checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate notebooks and repository tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install validation dependencies
        run: python -m pip install nbformat pytest

      - name: Validate notebook JSON and Python cell syntax
        run: python scripts/validate_notebooks.py

      - name: Run repository tests
        run: python -m pytest
